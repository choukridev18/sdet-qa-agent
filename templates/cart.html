<link rel="stylesheet" href="/static/style.css">

<h1>panier</h1>

{% if cart_items %}
  {% for item in cart_items %}
  <p>{{ item.slug|capitalize }} / Prix: {{ item.price }} EUR</p>
  {% endfor %}
  <p> Total: {{ total }} EUR </p>
{% else %}
  <p>Votre panier est vide</p>
{% endif %}
