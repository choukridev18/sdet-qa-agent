<link rel="stylesheet" href="/static/style.css">
<h1>Login</h1>
{% if error %}
<p>{{ error }}</p>
{% endif %}
<form action="/login" method="post">
    <input name="username" data-testid="login-username">
    <input name="password" data-testid="login-password"  type="password" id="password">
    <button type="button" data-testid="login-eye" id="eye">👁️</button>
    <button type="submit" data-testid="login-submit" > Connexion </button>
    
</form>

<a href="/"> Accueil</a>

<script>
    const eye = document.getElementById("eye") ;
    const field= document.getElementById("password") ;
    eye.addEventListener("click",function()
    {if(field.type == "password")
    {field.type="text";}
    else{field.type = "password"}}) ;
</script>
